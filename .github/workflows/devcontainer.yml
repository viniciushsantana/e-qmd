name: Dev Container

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "package.json"
      - "bun.lock"

jobs:
  validate:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Create development container
        run: devcontainer up --workspace-folder .

      - name: Verify toolchain and project
        run: |
          devcontainer exec --workspace-folder . node --version
          devcontainer exec --workspace-folder . bun --version
          devcontainer exec --workspace-folder . sqlite3 --version
          devcontainer exec --workspace-folder . codex --version
          devcontainer exec --workspace-folder . claude --version
          devcontainer exec --workspace-folder . gh --version
          devcontainer exec --workspace-folder . bun run lint
          devcontainer exec --workspace-folder . bun run test:types
          devcontainer exec --workspace-folder . bun run test
          devcontainer exec --workspace-folder . env QMD_DOCTOR_DEVICE_PROBE=0 bun src/cli/qmd.ts doctor
        env:
          CI: true
